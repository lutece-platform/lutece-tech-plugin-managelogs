# Manage logs properties file

#######################################################################################################
# Default Labels for XPage
managelogs.pageTitle=managelogs
managelogs.pagePathLabel=managelogs

# limit access to those log folders and sub-folders (absolute or relative) for the folders of managelogs.addlog.folder. Separate with ';'
managelogs.limit.folder=WEB-INF/logs;/usr/share/tomcat/logs/

# get logs from additionnal directory. Separate whith ';'
managelogs.addlog.folder=/usr/share/tomcat/logs/

# remove duplicate files from download list, based on file name, size (max default = 10MB) and content
managelogs.remove_duplicate_log_files=false
managelogs.max_filesize_for_comparaison=10485760